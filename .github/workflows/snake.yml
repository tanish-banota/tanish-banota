name: Contribution Snake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

concurrency:
  group: contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate light and dark Snake graphs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=%23C92A4B&color_dots=%23EBEDF0,%23FFD1DA,%23FCA5B5,%23E05272,%239B1238
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FF6B8A&color_dots=%23161B22,%2352192A,%23892E47,%23BD3D60,%23F46788

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake-output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
